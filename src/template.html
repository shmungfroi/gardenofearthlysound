<body>
<svg id="map" role="img" aria-label="The Garden of Earthly Sounds: eight spires growing from the commons, storeys rising from 800 at the ground to today at the top, lanterns for the forms"><g id="cam">%%MAP%%</g></svg>

<nav class="rail" aria-label="Tools">
  <div class="logo" aria-hidden="true">❦</div>
  <button data-sheet="search" title="Search (/)">⌕<small>Search</small></button>
  <button data-sheet="families">▥<small>Spires</small></button>
  <button data-sheet="eras">☰<small>Storeys</small></button>
  <button data-sheet="voices">♪<small>Voices</small></button>
  <button data-sheet="events">◆<small>Events</small></button>
  <button data-sheet="lenses">◎<small>Lenses</small></button>
  <button data-sheet="az">Az<small>A–Z</small></button>
  <button data-sheet="guide">?<small>Guide</small></button>
</nav>
<div class="sheet" id="sheet" role="dialog"></div>
<header class="top">
  <span class="t disp">THE GARDEN OF EARTHLY SOUNDS</span>
  <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
  <div class="search"><input id="q" type="search" placeholder="Find a lantern (any form)…" autocomplete="off" aria-label="Find a form"><div id="res" role="listbox"></div></div>
</header>
<div class="gut"></div><div id="eras"></div><div id="evs" aria-label="Events in time"></div><div id="tmark" aria-hidden="true"></div><div id="fams"></div><div id="lensbar" aria-label="Lenses on"></div>
<div class="mm" id="mm" title="The whole garden: click to go there"></div>
<div class="ladder" aria-label="Zoom levels">
  <div class="pm"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button></div>
  <button class="rung" data-l="0"><i></i>Garden</button><button class="rung" data-l="1"><i></i>Spire</button><button class="rung" data-l="2"><i></i>Storey</button><button class="rung" data-l="3"><i></i>Lantern</button><button class="rung" data-l="4" hidden><i></i>Voice</button>
</div>
<div id="hint" role="status"></div><div id="tip" role="tooltip"></div>
<aside id="panel" aria-live="polite"></aside>

<script src="gx_data.js"></script>
<script src="card.js"></script>
<script>
(() => {
const LAY = %%LAYOUT%%;
const G = window.GX, D = G.DATA, N = {}; D.nodes.forEach(n => N[n.id] = n);
const $ = s => document.querySelector(s), svg = $('#map'), cam = $('#cam'), panel = $('#panel');
const el = (t, cls, parent, text) => { const e = document.createElement(t); if (cls) e.className = cls; if (text != null) e.textContent = text; if (parent) parent.appendChild(e); return e; };
const FAMS = Object.keys(LAY.fams), FN = f => LAY.fams[f].name, FC = f => LAY.fams[f].c;
const NODE = {}; document.querySelectorAll('#map .fm').forEach(g => NODE[g.dataset.id] = g);
const BY = {}; document.querySelectorAll('#map .lk').forEach(p => { [p.dataset.a, p.dataset.b].forEach(id => (BY[id] = BY[id] || []).push(p)); });
const famOf = id => (LAY.nodes[id] || {}).f || 'commons';
const eraOf = id => N[id].period;
const ERA = {}; LAY.eras.forEach(e => ERA[e.id] = e);
const B = LAY.bounds;     // the sheet's edges: the view never leaves them

/* ---------- camera: map units to screen ---------- */
const view = {k: 1, tx: 0, ty: 0}; let aw = 0, ah = 0, fitK = 1, anim = null;
function measure() { const r = svg.getBoundingClientRect(); aw = r.width; ah = r.height; fitK = Math.min(aw / (B[2] - B[0]), ah / (B[3] - B[1])); }
const KMAX = 14, KMIN = () => fitK * .9;
function clamp(v) {
  v.k = Math.max(KMIN(), Math.min(KMAX, v.k));
  const mw = (B[2] - B[0]) * v.k, mh = (B[3] - B[1]) * v.k;
  v.tx = mw <= aw ? (aw - mw) / 2 - B[0] * v.k : Math.min(-B[0] * v.k, Math.max(aw - B[2] * v.k, v.tx));
  v.ty = mh <= ah ? (ah - mh) / 2 - B[1] * v.k : Math.min(-B[1] * v.k, Math.max(ah - B[3] * v.k, v.ty));
  return v; }
function apply() {
  cam.setAttribute('transform', `translate(${view.tx},${view.ty}) scale(${view.k})`);
  const fs = 3.4 * view.k; svg.classList.toggle('far', fs < 7.5); svg.classList.toggle('near', view.k > fitK * 2.6);
  // names in a lit web stay readable when the view is wide
  const s = Math.max(1, 2.3 / view.k);
  document.querySelectorAll('#map .fm.on:not(.soil),#map .fm.me:not(.soil),#map .fm.rtn:not(.soil)').forEach(g => { const p = LAY.nodes[g.dataset.id]; g.setAttribute('transform', s > 1 ? `translate(${p.x},${p.y}) scale(${s}) translate(${-p.x},${-p.y})` : ''); });
  const sb = Math.max(1, 3.6 / view.k); document.querySelectorAll('#lens .rt-b').forEach(g => { const x = +g.dataset.x, y = +g.dataset.y; g.setAttribute('transform', sb > 1 ? `translate(${x},${y}) scale(${sb}) translate(${-x},${-y})` : ''); });
  declutter(); chrome(); }
function declutter() {      // among lit names, any that would touch an earlier one hides its words (its point stays) until zooming makes room
  const gs = [...document.querySelectorAll('#map .fm.me:not(.soil),#map .fm.on:not(.soil),#map .fm.rtn:not(.soil)')]; gs.forEach(g => g.classList.remove('hid')); if (!gs.length || gs.length > 60) return;
  gs.sort((a, b) => b.classList.contains('me') - a.classList.contains('me')); const placed = [];
  gs.forEach(g => { const ts = g.querySelectorAll('text'); if (!ts.length) return; let r = null; ts.forEach(t => { const q = t.getBoundingClientRect(); r = r ? {l: Math.min(r.l, q.left), t: Math.min(r.t, q.top), r: Math.max(r.r, q.right), b: Math.max(r.b, q.bottom)} : {l: q.left, t: q.top, r: q.right, b: q.bottom}; });
    if (placed.some(p => r.l < p.r + 3 && r.r > p.l - 3 && r.t < p.b + 2 && r.b > p.t - 2)) g.classList.add('hid'); else placed.push(r); }); }
const centre = () => [(aw / 2 - view.tx) / view.k, (ah / 2 - view.ty) / view.k];
function flyTo(k, x, y, dur = 650) {           // one eased move that puts map point (x, y) at the centre of the view
  const a = {...view}, b = clamp({k, tx: aw / 2 - x * k, ty: ah / 2 - y * k}), t0 = performance.now();
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) dur = 0;
  cancelAnimationFrame(anim);
  const ca = [(aw / 2 - a.tx) / a.k, (ah / 2 - a.ty) / a.k], cb = [(aw / 2 - b.tx) / b.k, (ah / 2 - b.ty) / b.k];
  const step = now => { const u = dur ? Math.min(1, (now - t0) / dur) : 1, e = u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
    const k1 = a.k * Math.pow(b.k / a.k, e); view.k = k1;
    view.tx = aw / 2 - (ca[0] + (cb[0] - ca[0]) * e) * k1; view.ty = ah / 2 - (ca[1] + (cb[1] - ca[1]) * e) * k1; apply();
    if (u < 1) anim = requestAnimationFrame(step); };
  anim = requestAnimationFrame(step); }
function fitBox(x0, y0, x1, y1, kmax = KMAX) { const k = Math.min(kmax, aw / (x1 - x0), ah / (y1 - y0)); flyTo(k, (x0 + x1) / 2, (y0 + y1) / 2); }

/* ---------- where you are: garden, family, era, form ---------- */
let sel = null, spot = null, curFam = null, curEra = null, nav = 0;
const K_FAMILY = () => Math.max(fitK * 2.2, 2.4), K_ERA = () => Math.max(fitK * 3.6, 3.8);
function level() { if (tkey) return 4; if (sel || ekey) return 3; if (nav != null) return nav; if (view.k >= K_ERA() * .95) return 2; if (view.k >= K_FAMILY() * .9) return 1; return 0; }
function famAt(x) { let best = null, d = 1e9; FAMS.forEach(f => { const F = LAY.fams[f], c = (F.x0 + F.x1) / 2, dd = x < F.x0 ? F.x0 - x : x > F.x1 ? x - F.x1 : 0; if (dd < d || (dd === d && Math.abs(c - x) < Math.abs((LAY.fams[best]?.x0 + LAY.fams[best]?.x1) / 2 - x))) { d = dd; best = f; } }); return best; }
function eraAt(y) { return (LAY.eras.find(e => y >= e.top && y <= e.bottom) || (y < LAY.eras[LAY.eras.length - 1].top ? LAY.eras[LAY.eras.length - 1] : LAY.eras[0])).id; }
function home() { clearThread(); clearEvent(); closePanel(); clearSpot(); curFam = curEra = null; nav = 0; flyTo(fitK, (B[0] + B[2]) / 2, (B[1] + B[3]) / 2); }
function goFamily(f, keepY) { const F = LAY.fams[f]; curFam = f; curEra = null; nav = 1; const w = F.x1 - F.x0, k = Math.max(K_FAMILY(), Math.min(aw / (w + 220), K_ERA() * .85));
  const y = keepY != null ? keepY : Math.min(F.open, centre()[1]); flyTo(k, (F.x0 + F.x1) / 2, Math.max(LAY.present + ah / k / 2 - 30, y)); }
function goEra(f, e) { f = f || curFam || famAt(centre()[0]); const F = LAY.fams[f], E = ERA[e]; curFam = f; curEra = e; nav = 2;
  const k = Math.max(K_ERA(), Math.min(KMAX, ah / (E.bottom - E.top + 24), aw / (F.x1 - F.x0 + 160))); flyTo(k, (F.x0 + F.x1) / 2, (E.top + E.bottom) / 2); }
function goLevel(l) {
  const [cx, cy] = centre(), f = curFam || famAt(cx), e = curEra || eraAt(cy);
  if (l <= 0) return home();
  if (l === 1) { closePanel(); clearSpot(); return goFamily(f, cy); }
  if (l === 2) { closePanel(); clearSpot(); return goEra(f, e); }
  if (l >= 3) { if (sel) return frameNet(sel, true); flyTo(Math.min(KMAX, view.k * 1.6), cx, cy); } }

/* ---------- light a form's web ---------- */
function light(id) {
  svg.classList.toggle('focus', !!id);
  document.querySelectorAll('#map .on,#map .me').forEach(x => { x.classList.remove('on', 'me'); if (x.classList.contains('fm')) x.removeAttribute('transform'); });
  if (id) { NODE[id] && NODE[id].classList.add('me'); (BY[id] || []).forEach(p => { p.classList.add('on'); [p.dataset.a, p.dataset.b].forEach(j => j !== id && NODE[j] && NODE[j].classList.add('on')); p.parentNode.appendChild(p); }); }
  hits(); apply(); }
function web(id) { const s = new Set([id]); (BY[id] || []).forEach(p => { s.add(p.dataset.a); s.add(p.dataset.b); }); return [...s].filter(j => LAY.nodes[j]); }
function frameNet(id, withPanel) {           // the form with every form it connects to, as large as fits
  const ids = web(id), xs = ids.map(j => LAY.nodes[j].x), ys = ids.map(j => LAY.nodes[j].y);
  const x0 = Math.min(...xs) - 45, x1 = Math.max(...xs) + 45, y0 = Math.min(...ys) - 18, y1 = Math.max(...ys) + 14;
  const avail = withPanel ? aw : aw; const k = Math.max(KMIN(), Math.min(6, avail / (x1 - x0), (ah - 60) / (y1 - y0)));
  flyTo(k, (x0 + x1) / 2, (y0 + y1) / 2 + 6); }
function spotlight(id) {      // search: highlight, connect, frame the whole web; a click then opens it
  clearThread(); clearEvent(); closePanel(); sel = null; spot = id; light(id); frameNet(id, false);
  const n = (BY[id] || []).length, h = $('#hint'); h.innerHTML = ''; el('b', '', h, N[id].t); h.append(` · ${n} connection${n === 1 ? '' : 's'} · click it to open`); h.style.display = 'block'; chrome(); }
function clearSpot() { spot = null; $('#hint').style.display = 'none'; if (!sel) light(null); }
function choose(id, frame) {
  clearThread(); clearEvent(); $('#hint').style.display = 'none'; spot = null; sel = id; curFam = famAt(LAY.nodes[id].x); curEra = eraOf(id);
  light(id); card(id); document.body.classList.add('pan'); measure(); clamp(view); if (frame) frameNet(id, true); else apply(); }
function closePanel() { if (!sel && !tkey && !ekey && !document.body.classList.contains('pan')) return; if (tkey || ekey) { clearThread(); clearEvent(); light(null); } sel = null; document.body.classList.remove('pan'); measure(); clamp(view); light(spot); }

/* ---------- the card ---------- */
const MINARET = {}; G.MIN.genres.forEach(g => g.lanterns.forEach(id => MINARET[id] = g.t));
function card(id) {
  const f = famAt(LAY.nodes[id].x), n = N[id];
  const fams = [famOf(id), ...(n.also || [])].filter((x, i, a) => LAY.fams[x] && a.indexOf(x) === i).map(x => ({name: FN(x), c: FC(x)}));
  window.GardenCard.render(panel, id, {go: o => choose(o, true), close: () => { closePanel(); light(null); }, thread: k => showThread(k), event: e => showEvent(e), route: lens.n && lens.n.startsWith('r-') ? lens.n.slice(2) : null, walk: k => setCourse(k ? 'r-' + k : ''), famName: FN(f), eraName: (ERA[n.period] || {}).name || '', fams, minaret: MINARET[id] || ''});
}

/* ---------- F2 voices: a composer's gold thread through every lantern they wrote in ---------- */
const VOICES = window.GardenCard.VOICES, SVGNS = 'http://www.w3.org/2000/svg';
const gThread = document.createElementNS(SVGNS, 'g'); gThread.setAttribute('id', 'thread'); cam.insertBefore(gThread, cam.querySelector(':scope > .fm'));
let tkey = null;
function segs(pts) { const out = []; for (let i = 0; i < pts.length - 1; i++) { const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
  out.push(`M${p1[0]},${p1[1]} C${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]}`); } return out; }
function smooth(pts) { if (pts.length < 2) return ''; let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) { const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += ` C${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]}`; } return d; }
function showThread(key) {
  const V = VOICES[key]; if (!V) return; closeSheet(); clearEvent(); $('#hint').style.display = 'none'; spot = null; sel = null; tkey = key; nav = 4;
  svg.classList.add('focus'); document.querySelectorAll('#map .on,#map .me').forEach(x => { x.classList.remove('on', 'me'); if (x.classList.contains('fm')) x.removeAttribute('transform'); });
  V.forms.forEach(f => NODE[f.id] && NODE[f.id].classList.add('on'));
  const pts = V.forms.map(f => LAY.nodes[f.id]).filter(Boolean).map(p => [p.x, p.y]);
  gThread.innerHTML = ''; const mk = (t, a) => { const e = document.createElementNS(SVGNS, t); for (const k in a) e.setAttribute(k, a[k]); gThread.appendChild(e); return e; };
  if (pts.length > 1) {      // a constellation: each lantern joins its nearest neighbour (minimum spanning tree), so the thread never zigzags across the garden
    const inT = [0], edges = [], dist = (a, b) => Math.hypot(pts[a][0] - pts[b][0], (pts[a][1] - pts[b][1]) * 1.6);
    while (inT.length < pts.length) { let best = null; inT.forEach(a => pts.forEach((_, b) => { if (inT.includes(b)) return; const d = dist(a, b); if (!best || d < best[2]) best = [a, b, d]; })); edges.push(best); inT.push(best[1]); }
    let d = ''; edges.forEach(([a, b]) => { const [x1, y1] = pts[a], [x2, y2] = pts[b], L = Math.hypot(x2 - x1, y2 - y1) || 1, bow = Math.min(10, L * .12); d += `M${x1},${y1} Q${(x1 + x2) / 2 + (y1 - y2) / L * bow},${(y1 + y2) / 2 - Math.abs(x2 - x1) / L * bow} ${x2},${y2} `; });
    mk('path', {d, class: 'thr-glow'}); mk('path', {d, class: 'thr-line'}); }
  pts.forEach((p, i) => mk('circle', {cx: p[0], cy: p[1], r: 2.4, class: 'thr-ring' + (i === 0 ? ' first' : '')}));
  window.GardenCard.renderComposer(panel, key, {go: o => { clearThread(); choose(o, true); }, close: () => { clearThread(); closePanel(); light(null); },
    famOf: id => famAt(LAY.nodes[id].x), famName: id => FN(famAt(LAY.nodes[id].x)), eraName: id => (ERA[N[id].period] || {}).name || ''});
  document.body.classList.add('pan'); measure(); clamp(view);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), x0 = Math.min(...xs) - 50, x1 = Math.max(...xs) + 50, y0 = Math.min(...ys) - 22, y1 = Math.max(...ys) + 16;
  flyTo(Math.max(KMIN(), Math.min(6, aw / (x1 - x0), (ah - 60) / (y1 - y0))), (x0 + x1) / 2, (y0 + y1) / 2 + 6); apply(); }
function clearThread() { if (!tkey) return; tkey = null; gThread.innerHTML = ''; if (nav === 4) nav = null; }

/* ---------- F4 time: 91 events on the storey gutter, the event card, and a time marker ---------- */
const EVENTS = window.GardenCard.EVENTS, EVL = Object.values(EVENTS).sort((a, b) => a.y - b.y);
const yOfYear = yr => { const e = LAY.eras.find(z => yr >= z.start && yr < z.end) || (yr < LAY.eras[0].start ? LAY.eras[0] : LAY.eras[LAY.eras.length - 1]); const t = Math.max(0, Math.min(1, (yr - e.start) / (e.end - e.start))); return e.bottom - 8 - t * (e.bottom - e.top - 16); };
const yearOfY = y => { const e = LAY.eras.find(z => y >= z.top && y <= z.bottom); if (!e) return null; const t = Math.max(0, Math.min(1, (e.bottom - 8 - y) / (e.bottom - e.top - 16))); return Math.round(e.start + t * (e.end - e.start)); };
const gEvent = document.createElementNS(SVGNS, 'g'); gEvent.setAttribute('id', 'evlayer'); cam.insertBefore(gEvent, gThread);
const gTime = document.createElementNS(SVGNS, 'line'); gTime.setAttribute('id', 'timeline'); gTime.setAttribute('x1', B[0]); gTime.setAttribute('x2', B[2]); cam.appendChild(gTime);
let ekey = null; const EVEL = {};
EVL.forEach(e => { e.wy = yOfYear(e.y); const b = el('button', 'evd', $('#evs')); b.setAttribute('aria-label', `${e.t}, ${e.d}`); b.title = `${e.t} · ${e.d}`;
  b.onmouseenter = () => { if (!ekey) previewYear(e.wy, e.t + ' · ' + e.d); }; b.onmouseleave = () => { if (!ekey) previewYear(null); }; b.onclick = () => showEvent(e.id); EVEL[e.id] = b; });
function previewYear(wy, text) { const lab = $('#tmark'); if (wy == null) { gTime.style.display = 'none'; lab.style.display = 'none'; return; }
  gTime.setAttribute('y1', wy); gTime.setAttribute('y2', wy); gTime.style.display = 'block'; const r = svg.getBoundingClientRect(), sy = r.top + view.ty + wy * view.k;
  lab.textContent = text; lab.style.display = 'block'; lab.style.top = (sy - 9) + 'px'; }
function showEvent(id) {
  const e = EVENTS[id]; if (!e) return; closeSheet(); clearThread(); $('#hint').style.display = 'none'; spot = null; sel = null; ekey = id; nav = 3; previewYear(null);
  svg.classList.add('focus'); document.querySelectorAll('#map .on,#map .me').forEach(x => { x.classList.remove('on', 'me'); if (x.classList.contains('fm')) x.removeAttribute('transform'); });
  const to = (e.to || []).filter(i => LAY.nodes[i]); to.forEach(i => NODE[i] && NODE[i].classList.add('on'));

    b.onmouseenter = b.onfocus = () => { if (!sel) light(n.id); }; b.onclick = () => { res.style.display = 'none'; q.value = ''; q.blur(); spotlight(n.id); }; }); });
q.addEventListener('keydown', e => { if (e.key === 'Enter' && res.firstChild) (res.querySelector('button:not(.vres):not(.eres):not(.rres)') || res.firstChild).click(); if (e.key === 'ArrowDown' && res.firstChild) { e.preventDefault(); res.firstChild.focus(); } if (e.key === 'Escape') { q.value = ''; res.style.display = 'none'; q.blur(); if (!sel && !spot && !tkey) light(null); } });
res.addEventListener('keydown', e => { const b = document.activeElement; if (e.key === 'ArrowDown' && b.nextSibling) { e.preventDefault(); b.nextSibling.focus(); } if (e.key === 'ArrowUp') { e.preventDefault(); (b.previousSibling || q).focus(); } if (e.key === 'Escape') { res.style.display = 'none'; q.focus(); } });
q.addEventListener('blur', () => setTimeout(() => { if (!res.contains(document.activeElement)) { res.style.display = 'none'; if (!sel && !spot && !tkey && !ekey) light(null); } }, 150));

/* ---------- the rail's sheets ---------- */
const sheet = $('#sheet');
function closeSheet() { sheet.classList.remove('open'); document.querySelectorAll('.rail button').forEach(b => b.classList.remove('on')); }
function openSheet(kind, btn) {
  if (sheet.classList.contains('open') && sheet.dataset.kind === kind) return closeSheet();
  closeSheet(); if (kind === 'search') { q.focus(); return; }
  sheet.innerHTML = ''; sheet.dataset.kind = kind; sheet.classList.add('open'); btn.classList.add('on');
  if (kind === 'families') { el('h3', '', sheet, 'THE SPIRES'); FAMS.forEach(f => { const b = el('button', '', sheet, FN(f)); b.style.color = FC(f); b.onclick = () => { closeSheet(); closePanel(); clearSpot(); goFamily(f); }; }); }
  if (kind === 'eras') { el('h3', '', sheet, 'THE STOREYS'); LAY.eras.slice().reverse().forEach(E => { const b = el('button', '', sheet, E.name); el('small', '', b, E.id === 'contemporary' ? '1980–today' : `${E.start}–${E.end}`); b.onclick = () => { closeSheet(); closePanel(); clearSpot(); goEra(null, E.id); }; }); }
  if (kind === 'voices') { el('h3', '', sheet, 'VOICES · ' + Object.keys(VOICES).length + ' COMPOSERS');
    const f = el('input', 'vf', sheet); f.placeholder = 'Filter composers…'; f.type = 'search'; const opts = el('div', 'vopts', sheet);
    const tW = el('label', '', opts); const cW = el('input', '', tW); cW.type = 'checkbox'; tW.append(' women'); const tR = el('label', '', opts); const cR = el('input', '', tR); cR.type = 'checkbox'; tR.append(' Americas & Australia');
    const tM = el('label', '', opts); const cM = el('input', '', tM); cM.type = 'checkbox'; cM.checked = true; tM.append(' 2+ lanterns');
    const list = el('div', 'vlist', sheet), all = Object.values(VOICES).sort((a, b) => a.name.localeCompare(b.name));
    const draw = () => { list.innerHTML = ''; const s = f.value.trim().toLowerCase(); let n = 0;
      all.filter(V => (!s || V.name.toLowerCase().includes(s)) && (!cW.checked || V.woman) && (!cR.checked || V.region === 'A' || V.region === 'U') && (!cM.checked || V.forms.length > 1)).forEach(V => { if (n++ > 400) return; const b = el('button', '', list, V.name); el('small', '', b, `${V.forms.length} lantern${V.forms.length === 1 ? '' : 's'}`); b.onclick = () => { closeSheet(); showThread(V.key); }; });
      if (!list.childNodes.length) el('p', '', list, 'No composer matches.'); };
    [f, cW, cR, cM].forEach(x => x.addEventListener('input', draw)); draw(); setTimeout(() => f.focus(), 30); }
  if (kind === 'events') { el('h3', '', sheet, 'EVENTS IN TIME · ' + EVL.length); EVL.forEach(e => { const b = el('button', '', sheet, e.t); el('small', '', b, e.d + (e.place ? ' · ' + e.place : '')); b.onclick = () => { closeSheet(); showEvent(e.id); }; }); }
  if (kind === 'lenses') { el('h3', '', sheet, 'LENSES');
    el('p', 'lnote', sheet, 'A lens lights every lantern that answers a question and quiets the rest. Turn on as many as you like; each wears its own ring.');
    LENSES.forEach(L => { const lb = el('label', 'lz', sheet); lb.style.setProperty('--lc', L.c); const c = el('input', '', lb); c.type = 'checkbox'; c.dataset.k = L.k; c.checked = lens.on.has(L.k); el('i', '', lb); lb.append(L.t); el('small', '', lb, L.dash ? `${L.set.size} + ${L.dash.size}` : L.set.size + ''); lb.title = L.set.size + ' ' + L.d + (L.dash ? `; dashed ring: ${L.dash.size} ${L.dd}` : ''); c.onchange = () => setLens(L.k, c.checked); });
    el('p', 'lnote', sheet, 'Aboriginal and Torres Strait Islander music: a solid ring marks music led by Aboriginal and Torres Strait Islander artists. A dashed ring marks music others made from Aboriginal culture, which its card now questions.');
    el('h4', '', sheet, 'NSW course · for teachers'); const s = el('select', '', sheet); s.setAttribute('aria-label', 'NSW course focus area, topic or route'); el('option', '', s, 'Choose a focus area, topic or route…').value = '';
    let og = null, last = ''; GC.NSW.A.forEach(a => { if (a.grp !== last) { og = el('optgroup', '', s); og.label = a.grp; last = a.grp; } const o = el('option', '', og, a.t); o.value = a.key; });
    s.value = lens.n; s.onchange = () => setCourse(s.value); const out = el('div', '', sheet);
    lensSheetCourse = () => { s.value = lens.n; out.innerHTML = ''; if (!lens.n) return; const r = el('p', 'nres', out); el('b', '', r, lens.nset.size + ' lantern' + (lens.nset.size === 1 ? '' : 's')); r.append(' light for this ' + (lens.n.startsWith('r-') ? 'route.' : 'course.'));
      if (lens.n.startsWith('r-')) { const c = GC.COURSES[lens.n.slice(2)], box = el('div', 'stops', out);
        c.stops.forEach((st, i) => { if (!LAY.nodes[st.id]) return; const b = el('button', '', box); el('em', '', b, (i + 1) + ' · ' + st.week); b.append(N[st.id].t); b.title = st.works.join('; '); b.onclick = () => choose(st.id, true); });
        (c.extra || []).forEach(x => { const p = el('p', 'lnote', out); el('b', '', p, x.week + '. '); p.append(x.note); }); }
      else { const box = el('div', 'stops', out); [...lens.nset].sort((a, b) => N[a].y - N[b].y || N[a].t.localeCompare(N[b].t)).slice(0, 60).forEach(i => { const b = el('button', '', box, N[i].t); el('small', '', b, N[i].d || ''); b.onclick = () => choose(i, true); }); }
      el('p', 'lnote', out, 'Matches are the Garden’s suggestions from each form’s period, family, kind and dates: check them against the syllabus.'); };
    lensSheetCourse();
    const cl = el('button', '', sheet, 'Turn every lens off'); cl.style.marginTop = '12px'; cl.style.color = 'var(--muted)'; cl.onclick = () => { lens.on.clear(); sheet.querySelectorAll('input').forEach(c => c.checked = false); setCourse(''); }; }
  if (kind === 'az') { el('h3', '', sheet, 'EVERY LANTERN, A–Z'); D.nodes.filter(n => LAY.nodes[n.id]).sort((a, b) => a.t.localeCompare(b.t)).forEach(n => { const b = el('button', '', sheet, n.t); el('small', '', b, n.d || ''); b.onclick = () => { closeSheet(); spotlight(n.id); }; }); }
  if (kind === 'guide') { el('h3', '', sheet, 'HOW TO READ THE GARDEN');
    [['Storeys rise.', ' The ground is the year 800; the top is today. Each storey (period) is named on the left.'], ['The commons is the central spire.', ' Folk song, dance and work song rises from one seed at the bottom: the origin. From it, roots fan out to every spire, and its green branches reach the lanterns it fed.'],
     ['Spires are the families.', ' Each grows from a root in the ground and blooms where its oldest form begins. Inside, its minarets (genres) stand side by side.'], ['Lanterns are the forms.', ' A small gold point with its name. Click one to light its links and open its card.'],
     ['Links:', ' solid gold = grew from, dotted gold = influenced, red = reacted against, green = from the commons.'],
     ['Every line is a path:', ' when a lantern is open, hover any of its links to read the connection and click it to travel to the lantern at the other end. Route steps and event lines work the same way.'],
     ['Lenses ◎:', ' light the lanterns that answer one question (women composers, the Americas & Australia, oral & folk sources, Aboriginal and Torres Strait Islander music) or serve one NSW course, topic or route. Each wears its own ring; a route also shows its stops in teaching order.'],
     ['Move:', ' drag, scroll or pinch; + and − or the ladder step Garden › Spire › Storey › Lantern; arrow keys move to the next spire or storey; / searches.']]
      .forEach(([b, t]) => { const p = el('p', '', sheet); el('b', '', p, b); p.append(t); }); }
}
document.querySelectorAll('.rail button').forEach(b => b.onclick = () => openSheet(b.dataset.sheet, b));

})();
